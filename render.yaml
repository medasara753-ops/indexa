services:
  - type: web
    name: indexa
    runtime: node
    plan: starter            # required for persistent disks (free plan has none)
    region: frankfurt        # closest EU region; change if you prefer
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: INDEXA_DB
        value: /var/data/indexa.db
      # - key: INDEXA_BASE_URL          # set this to your custom domain if you add one
      #   sync: false
    disk:
      name: indexa-data
      mountPath: /var/data
      sizeGB: 1
